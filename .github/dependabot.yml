version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One big PR for all action updates
    groups:
      all-actions:
        patterns:
          - "*"
  - package-ecosystem: "bazel"
    # MODULE.bazel at the repository root
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One PR for all minor and patch updates; majors arrive one per PR
    groups:
      bazel-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # grpc and protobuf majors ripple through p4runtime and its consumers
    ignore:
      - dependency-name: "grpc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
