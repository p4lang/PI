name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-changes:
    name: Check whether tests need to be run based on diff
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: antrea-io/has-changes@v2
      id: check_diff
      with:
        paths-ignore: docs/* *.md bazel/*
    outputs:
      has_changes: ${{ steps.check_diff.outputs.has_changes }}

  test:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.has_changes == 'yes' }}
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        include:
        - cxx: g++
          cc: gcc
        - cxx: clang++
          cc: clang
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Build test Docker image
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: |
        docker build -t pi --build-arg IMAGE_TYPE=test --build-arg CC=$CC --build-arg CXX=$CXX -f Dockerfile.bmv2 .
    - name: Run unit tests
      run: |
        docker run -w /PI pi bash -c \
          'echo /usr/local/lib/python3.12/dist-packages && \
          ls -la /usr/local/lib/python3.12/dist-packages && \
          echo /usr/local/lib/python3.12/site-packages && \
          ls -la /usr/local/lib/python3.12/site-packages && \
          echo /usr/lib/python3/dist-packages && \
          ls -la /usr/lib/python3/dist-packages && \
          find / -name dist-packages -o -name site-packages && \
          uv run ./proto/ptf/base_test.py'
    - name: Run tests
      run: |
        docker run -w /PI pi bash -c \
          'uv run make check -j2 || (find . -name "test-suite.log" | xargs cat)'
