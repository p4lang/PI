name: Cache maintenance
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  actions: write
  pull-requests: read
concurrency:
  group: cache-maintenance
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep main caches and clean up PR caches
        uses: p4lang/.github/CI/cache-retention@4bec527fd3988345ec240ae8f4f000bc938e4259
        with:
          key-prefixes: bazel-v2-
